name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deployment-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test deployment command and archive boundaries
        run: python3 -m unittest discover -s ops/contabo/tests -v

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: manarah
          POSTGRES_USER: manarah
          POSTGRES_PASSWORD: ci-postgres-pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U manarah -d manarah"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The suite runs on PostgreSQL, the same database production uses.
      - name: Run backend tests (PostgreSQL + Redis services)
        working-directory: backend
        env:
          MANARAH_TEST_PG_URL: jdbc:postgresql://localhost:5432/manarah
          MANARAH_TEST_PG_USER: manarah
          MANARAH_TEST_PG_PASSWORD: ci-postgres-pass
        run: >
          mvn -B test
          -Dspring.profiles.active=postgres
          -DMANARAH_JWT_SECRET=Y2ktdGVzdC1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2Q=

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Course teacher filter regression tests
        working-directory: frontend
        run: node --test src/lib/courseFilters.test.js
      - working-directory: frontend
        run: npm run build
      # What ships to browsers must have no high/critical advisory; build-only tools (Tailwind's file watcher
      # chain) are held to critical, since some high ones there have no fixed release.
      - name: Fail on known high/critical vulnerabilities
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high && npm audit --audit-level=critical

  stack-smoke-test:
    runs-on: ubuntu-latest
    needs: [backend, frontend, deployment-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Write a CI-only .env for docker compose
        run: |
          cat > .env <<EOF
          POSTGRES_DB=manarah
          POSTGRES_USER=manarah
          POSTGRES_PASSWORD=ci-postgres-pass
          MANARAH_REDIS_PASSWORD=ci-redis-pass
          MANARAH_JWT_SECRET=Y2ktdGVzdC1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2Q=
          MANARAH_DEMO_SEED_ENABLED=true
          MANARAH_DEMO_PASSWORD=manarah123
          MANARAH_STORAGE_PROVIDER=s3
          MANARAH_S3_BUCKET=manarah-files
          MINIO_ROOT_USER=manarah
          MINIO_ROOT_PASSWORD=ci-minio-pass
          EOF
      - name: Build and start the full stack (postgres, redis, minio, backend, frontend)
        run: docker compose up --build -d
      - name: Wait for backend/frontend health
        run: |
          docker compose up --wait --wait-timeout 240
      - name: Smoke test login through the real stack
        run: |
          curl -fsS -X POST http://localhost/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@manarah.io","password":"manarah123"}' | grep -q accessToken
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Clean up test stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy-production:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [backend, frontend, deployment-checks, stack-smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://droos.com.co
    concurrency:
      group: contabo-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure the restricted SSH deployment key
        env:
          DEPLOY_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.CONTABO_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/contabo_lms
          chmod 600 ~/.ssh/contabo_lms
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy the tested main commit to Contabo
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_HOST: ${{ vars.CONTABO_HOST }}
          DEPLOY_PORT: ${{ vars.CONTABO_PORT }}
          DEPLOY_USER: ${{ vars.CONTABO_USER }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" != "$RELEASE_SHA" ]; then
            echo 'A newer main commit exists; this tested commit will not replace it.'
            exit 0
          fi
          git archive --format=tar.gz --output=/tmp/lms-source.tar.gz HEAD
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            -i ~/.ssh/contabo_lms -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $RELEASE_SHA" < /tmp/lms-source.tar.gz
          curl --fail --silent --show-error --retry 3 "https://droos.com.co/release.json?commit=$RELEASE_SHA" \
            | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["commit"] == os.environ["RELEASE_SHA"]'
      - name: Remove the runner's temporary deployment key
        if: always()
        run: rm -f ~/.ssh/contabo_lms /tmp/lms-source.tar.gz
