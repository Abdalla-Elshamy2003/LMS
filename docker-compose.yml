name: manarah

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manarah}
      POSTGRES_USER: ${POSTGRES_USER:-manarah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - manarah-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manarah} -d ${POSTGRES_DB:-manarah}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - manarah-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${MANARAH_REDIS_PASSWORD:?Set MANARAH_REDIS_PASSWORD in .env}"]
    volumes:
      - manarah-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${MANARAH_REDIS_PASSWORD:?Set MANARAH_REDIS_PASSWORD in .env}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    networks:
      - manarah-net

  # S3-compatible object storage for local dev/testing of the multi-instance-safe file storage
  # path. In real production, point MANARAH_S3_* at a managed provider (Cloudflare R2, AWS S3,
  # Backblaze B2, ...) instead of running MinIO yourself.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-manarah}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - manarah-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - manarah-net

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-manarah}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/${MANARAH_S3_BUCKET:-manarah-files} &&
      exit 0
      "
    networks:
      - manarah-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: manarah-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-postgres}
      MANARAH_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-manarah}
      MANARAH_DB_USERNAME: ${POSTGRES_USER:-manarah}
      MANARAH_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MANARAH_REDIS_HOST: redis
      MANARAH_REDIS_PORT: 6379
      MANARAH_REDIS_PASSWORD: ${MANARAH_REDIS_PASSWORD:?Set MANARAH_REDIS_PASSWORD in .env}
      MANARAH_JWT_SECRET: ${MANARAH_JWT_SECRET:?Set MANARAH_JWT_SECRET in .env}
      MANARAH_CORS_ALLOWED_ORIGINS: ${MANARAH_CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      MANARAH_COOKIE_SECURE: ${MANARAH_COOKIE_SECURE:-false}
      MANARAH_API_DOCS_ENABLED: ${MANARAH_API_DOCS_ENABLED:-false}
      MANARAH_DEMO_SEED_ENABLED: ${MANARAH_DEMO_SEED_ENABLED:-false}
      MANARAH_DEMO_PASSWORD: ${MANARAH_DEMO_PASSWORD:-}
      MANARAH_WHATSAPP_ENABLED: ${MANARAH_WHATSAPP_ENABLED:-false}
      MANARAH_WHATSAPP_ACCESS_TOKEN: ${MANARAH_WHATSAPP_ACCESS_TOKEN:-}
      MANARAH_WHATSAPP_PHONE_NUMBER_ID: ${MANARAH_WHATSAPP_PHONE_NUMBER_ID:-}
      MANARAH_WHATSAPP_APP_SECRET: ${MANARAH_WHATSAPP_APP_SECRET:-}
      MANARAH_WHATSAPP_VERIFY_TOKEN: ${MANARAH_WHATSAPP_VERIFY_TOKEN:-}
      MANARAH_AI_ENABLED: ${MANARAH_AI_ENABLED:-false}
      MANARAH_VDOCIPHER_SECRET: ${MANARAH_VDOCIPHER_SECRET:-}
      MANARAH_VIDEO_REQUIRE_DRM: ${MANARAH_VIDEO_REQUIRE_DRM:-false}
      MANARAH_VIDEO_MAX_SESSIONS: ${MANARAH_VIDEO_MAX_SESSIONS:-1}
      MANARAH_VIDEO_REQUIRE_BROWSER_FETCH: ${MANARAH_VIDEO_REQUIRE_BROWSER_FETCH:-true}
      MANARAH_AI_BASE_URL: ${MANARAH_AI_BASE_URL:-https://openrouter.ai/api/v1}
      MANARAH_AI_API_KEY: ${MANARAH_AI_API_KEY:-}
      MANARAH_AI_MODEL: ${MANARAH_AI_MODEL:-inclusionai/ling-3.0-flash-fin:free}
      # 'local' is fine for a single instance. Set to 's3' (with the MANARAH_S3_* vars below) once
      # you run more than one backend instance - see docker-compose scale note below.
      MANARAH_STORAGE_PROVIDER: ${MANARAH_STORAGE_PROVIDER:-local}
      MANARAH_S3_BUCKET: ${MANARAH_S3_BUCKET:-manarah-files}
      MANARAH_S3_REGION: us-east-1
      MANARAH_S3_ENDPOINT: http://minio:9000
      MANARAH_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-manarah}
      MANARAH_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MANARAH_S3_PATH_STYLE: "true"
    volumes:
      # Only used while MANARAH_STORAGE_PROVIDER=local. Irrelevant (but harmless) once you switch
      # to s3/MinIO - uploaded files then live in the minio-data volume instead.
      - manarah-data:/app/data
    ports:
      # Published mainly for direct API/Swagger access during development. Not published when
      # scaling to more than one replica (see note below) - the frontend container always talks
      # to this service by name over the internal compose network, which Docker load-balances
      # across replicas automatically.
      - "${BACKEND_PORT:-8091}:8091"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    networks:
      - manarah-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: manarah-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - manarah-net

networks:
  manarah-net:
    driver: bridge

volumes:
  manarah-data:
  manarah-postgres:
  manarah-redis:
  manarah-minio:

# To verify the app is actually safe to run as more than one backend instance (the whole point of
# the Postgres/Redis/S3 migration), set MANARAH_STORAGE_PROVIDER=s3 in .env, then:
#   docker compose up --build -d postgres redis minio minio-init frontend
#   docker compose up --build -d --scale backend=2 --no-recreate backend
# (the fixed "ports:" mapping on backend must be removed/commented first - two replicas can't
# both bind host port 8091; the frontend's nginx reaches whichever replica Docker's internal DNS
# picks, which is exactly what you want to exercise).
