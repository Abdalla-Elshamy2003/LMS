server:
  port: 8091
  servlet:
    context-path: /

spring:
  application:
    name: manarah-lms
  # PostgreSQL is the only supported database (see application-postgres.yml).
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${MANARAH_REDIS_HOST:localhost}
      port: ${MANARAH_REDIS_PORT:6379}
      password: ${MANARAH_REDIS_PASSWORD:}
  mail:
    # Blank host keeps the JavaMailSender bean from being created at all — SmtpEmailSender handles
    # its absence and falls back to logging, so the app still boots with no SMTP configured.
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB

manarah:
  # This app's own public base URL (e.g. https://manarah.example.com). Used to build the links we
  # send out — password-reset mails, payment redirects. Without it those links are relative and
  # unusable from an inbox, so set MANARAH_PUBLIC_APP_URL on any real deployment.
  public-app-url: ${MANARAH_PUBLIC_APP_URL:}
  email:
    # Real SMTP delivery for notifications and password-reset links. Leave 'enabled: false' (or
    # spring.mail.host blank) to keep the safe stub behaviour — logs only, never claims a message
    # was sent. See SmtpEmailSender for the full setup.
    enabled: ${MANARAH_EMAIL_ENABLED:false}
    from: ${MANARAH_EMAIL_FROM:}
  security:
    jwt:
      # Base64-encoded 256-bit secret. Override in production via MANARAH_JWT_SECRET.
      secret: ${MANARAH_JWT_SECRET}
      # 30 days by default so staff scanning gate/attendance QR codes on a personal phone stay
      # signed in instead of hitting a login wall mid-shift; there is no refresh-token flow, so
      # this access token is the only thing keeping the session alive.
      access-token-ttl-minutes: ${MANARAH_JWT_ACCESS_TTL_MINUTES:43200}
      refresh-token-ttl-days: 30
    cors:
      allowed-origins: ${MANARAH_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    cookies:
      # Set true whenever the public site is served over HTTPS.
      secure: ${MANARAH_COOKIE_SECURE:false}
    login:
      max-failures: ${MANARAH_LOGIN_MAX_FAILURES:8}
      window-minutes: ${MANARAH_LOGIN_WINDOW_MINUTES:15}
  bootstrap:
    # Creates a head-office admin once, if the username doesn't exist yet (never changes an existing account).
    # The password is given as a BCrypt hash only. Remove both after the first sign-in.
    admin:
      username: ${MANARAH_BOOTSTRAP_ADMIN_USERNAME:}
      password-hash: ${MANARAH_BOOTSTRAP_ADMIN_PASSWORD_HASH:}
  demo:
    # Demo data contains public sample accounts; it is opt-in and must stay disabled in production.
    seed-enabled: ${MANARAH_DEMO_SEED_ENABLED:false}
    password: ${MANARAH_DEMO_PASSWORD:}
  storage:
    root: ./data/files
    # 'local' writes to disk on the running instance only - safe with exactly one backend instance.
    # Must be 's3' once more than one backend instance is running, since a file written to one
    # instance's disk is invisible to the others.
    provider: ${MANARAH_STORAGE_PROVIDER:local}
    s3:
      bucket: ${MANARAH_S3_BUCKET:}
      region: ${MANARAH_S3_REGION:auto}
      # Any S3-compatible endpoint: Cloudflare R2, AWS S3, Backblaze B2, or local MinIO for dev.
      endpoint: ${MANARAH_S3_ENDPOINT:}
      access-key: ${MANARAH_S3_ACCESS_KEY:}
      secret-key: ${MANARAH_S3_SECRET_KEY:}
      # MinIO/local dev needs path-style URLs; real cloud providers use virtual-hosted style.
      path-style-access: ${MANARAH_S3_PATH_STYLE:false}
  video:
    vdocipher-secret: ${MANARAH_VDOCIPHER_SECRET:}
    require-drm: ${MANARAH_VIDEO_REQUIRE_DRM:false}
    # How many devices one account may stream on at the same time; a new device replaces the oldest.
    max-concurrent-sessions: ${MANARAH_VIDEO_MAX_SESSIONS:1}
    # Reject stream requests that lack the browser's <video> fetch metadata (download managers, curl, scripts).
    require-browser-fetch: ${MANARAH_VIDEO_REQUIRE_BROWSER_FETCH:true}
    # Where uploaded lesson videos live: 'local' (the server's disk) or 'r2' (Cloudflare R2, uploaded straight from
    # the browser). Separate from manarah.storage so switching videos to R2 never strands the other files.
    storage: ${MANARAH_VIDEO_STORAGE:local}
    max-bytes: ${MANARAH_VIDEO_MAX_BYTES:4294967296}
    r2:
      # https://<ACCOUNT_ID>.r2.cloudflarestorage.com — from Cloudflare > R2 > API tokens.
      endpoint: ${MANARAH_R2_ENDPOINT:}
      bucket: ${MANARAH_R2_BUCKET:}
      access-key: ${MANARAH_R2_ACCESS_KEY_ID:}
      secret-key: ${MANARAH_R2_SECRET_ACCESS_KEY:}
    transcode:
      # FFmpeg -> HLS (360p/720p/1080p, AES-128). Needs real CPU: turn it on where the server has it.
      enabled: ${MANARAH_VIDEO_TRANSCODE:false}
      ffmpeg: ${MANARAH_FFMPEG:ffmpeg}
      ffprobe: ${MANARAH_FFPROBE:ffprobe}
      work-dir: ${MANARAH_VIDEO_WORK_DIR:${java.io.tmpdir}}
  whatsapp:
    # Real WhatsApp delivery via Meta's Cloud API. Leave 'enabled: false' (or the
    # token/phone-number-id blank) to keep the safe stub behavior (logs only, never
    # claims a message was sent). See WhatsAppCloudApiSender for setup details.
    enabled: ${MANARAH_WHATSAPP_ENABLED:false}
    access-token: ${MANARAH_WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${MANARAH_WHATSAPP_PHONE_NUMBER_ID:}
    # Meta App Secret used to verify X-Hub-Signature-256 on every inbound POST.
    app-secret: ${MANARAH_WHATSAPP_APP_SECRET:}
    api-version: v20.0
    default-country-code: "20"
    # Shared secret Meta sends back during the webhook subscription handshake (hub.verify_token).
    # Set MANARAH_WHATSAPP_VERIFY_TOKEN to whatever you register in Meta App Dashboard > WhatsApp > Configuration.
    verify-token: ${MANARAH_WHATSAPP_VERIFY_TOKEN:}
  sms:
    # Real SMS delivery through a bulk-SMS gateway's HTTP API. Every Egyptian provider names its
    # parameters differently, so the names are configuration rather than hardcoded — see
    # HttpSmsSender for a worked example. Leave 'enabled: false' (or the url blank) to keep the
    # safe stub behaviour: logs only, never claims a message was sent.
    enabled: ${MANARAH_SMS_ENABLED:false}
    url: ${MANARAH_SMS_URL:}
    method: ${MANARAH_SMS_METHOD:GET}
    recipient-param: ${MANARAH_SMS_RECIPIENT_PARAM:mobile}
    message-param: ${MANARAH_SMS_MESSAGE_PARAM:message}
    sender-param: ${MANARAH_SMS_SENDER_PARAM:sender}
    # The registered Sender ID shown to the recipient — the provider must approve it first.
    sender-id: ${MANARAH_SMS_SENDER_ID:}
    # Full Authorization header value if the gateway uses one, e.g. "Bearer abc123".
    auth-header: ${MANARAH_SMS_AUTH_HEADER:}
    # Any remaining gateway parameters as "key:value" pairs, comma-separated (username, password, ...).
    extra-params: ${MANARAH_SMS_EXTRA_PARAMS:}
    default-country-code: "20"
  ai:
    # AI-assisted question generation for the exam question bank (OpenAI-compatible chat
    # completions API — works with OpenRouter, OpenAI, or any compatible provider). Leave
    # 'enabled: false' (or the api-key blank) to keep generation disabled with a clear error
    # instead of silently failing. See AiQuestionGenerator for details.
    enabled: ${MANARAH_AI_ENABLED:false}
    base-url: ${MANARAH_AI_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${MANARAH_AI_API_KEY:}
    model: ${MANARAH_AI_MODEL:inclusionai/ling-3.0-flash-fin:free}
  payment:
    sandbox-enabled: ${MANARAH_PAYMENT_SANDBOX_ENABLED:false}
    paymob:
      # Real course-payment gateway (Paymob Accept — Egypt's standard aggregator for card +
      # mobile wallets like Vodafone Cash; Fawry/InstaPay are NOT confirmed available through
      # this API, see PaymobGatewayService). Leave 'enabled: false' (or the keys blank) to keep
      # the existing sandbox/demo checkout behavior instead of a live gateway.
      enabled: ${MANARAH_PAYMOB_ENABLED:false}
      secret-key: ${MANARAH_PAYMOB_SECRET_KEY:}
      public-key: ${MANARAH_PAYMOB_PUBLIC_KEY:}
      hmac-secret: ${MANARAH_PAYMOB_HMAC_SECRET:}
      # Comma-separated Integration IDs from your Paymob Accept Dashboard > Payment Integrations
      # (one per enabled payment method — card, Vodafone Cash, ...). Paymob's own hosted
      # checkout page shows exactly the methods behind these IDs; nothing is hardcoded here.
      integration-ids: ${MANARAH_PAYMOB_INTEGRATION_IDS:}
      api-base-url: ${MANARAH_PAYMOB_API_BASE_URL:https://accept.paymob.com}
      checkout-base-url: ${MANARAH_PAYMOB_CHECKOUT_BASE_URL:https://eg.checkout.paymob.com/}
      # This app's own public base URL, used to build the webhook/redirect URLs Paymob calls
      # back to (e.g. https://your-domain.com). Required for the gateway to actually work.
      public-app-url: ${MANARAH_PUBLIC_APP_URL:}

management:
  health:
    # spring-boot-starter-mail registers a health indicator that opens a real SMTP connection on
    # every /actuator/health call. With no SMTP configured that reports DOWN and the container
    # healthcheck fails the deployment; even with SMTP configured, a temporarily unreachable mail
    # provider must not mark the whole platform unhealthy. Delivery failures are handled inside
    # SmtpEmailSender instead.
    mail:
      enabled: false

springdoc:
  api-docs:
    # API documentation is an administrative tool and is disabled unless explicitly enabled.
    enabled: ${MANARAH_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${MANARAH_API_DOCS_ENABLED:false}
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.manarah: INFO
    org.hibernate.SQL: WARN
